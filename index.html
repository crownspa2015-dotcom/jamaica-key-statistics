<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jamaica — Key Statistics</title><style>
:root{
  --ink:#0b1b4c;
  --muted:#60708e;
  --line:#dce7f2;
  --card:#ffffff;
  --social:#eaf4ff;
  --economic:#e9f5ff;
  --env:#e8f8f5;
  --blue:#0d6fe8;
  --blue2:#67b8f5;
  --green:#18a48f;
  --green2:#7dd8c8;
}

*{box-sizing:border-box;min-width:0}

html,body{
  margin:0;
  max-width:100%;
  overflow-x:hidden;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
  background:#ffffff;
}

.wrap{
  width:100%;
  max-width:none;
  margin:0;
  padding:16px 14px 28px;
  overflow-x:hidden;
}

/* ---------- HERO ---------- */

.hero{
  display:block;
  margin-bottom:16px;
}

.hero h1{
  font-size:42px;
  line-height:1.05;
  margin:6px 0 10px;
  color:#111f5a;
}

.hero p{
  font-size:16px;
  line-height:1.4;
  margin:0;
  color:#334a77;
  max-width:100%;
}


/* ---------- PILLARS ---------- */

.pillar{
  border-radius:16px;
  padding:12px;
  margin:16px 0;
}

.social{background:var(--social)}
.economic{background:var(--economic)}
.environment{background:var(--env)}

.pillar-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:2px 4px 10px;
}

.badge{
  width:54px;
  height:54px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:24px;
  font-weight:bold;
  background:linear-gradient(135deg,#0878ef,#0a4da4);
  flex:0 0 auto;
}

.environment .badge{
  background:linear-gradient(135deg,#16a995,#087565);
}

.pillar-head h2{
  font-size:26px;
  margin:0;
  white-space:nowrap;
}

.tag{
  font-size:13px;
  color:#335987;
}

.strap{
  margin-left:auto;
  font-size:13px;
  color:#315a88;
  text-align:right;
  max-width:40%;
}

/* ---------- FLEXIBLE CARD GRID ---------- */
/* No forced 5-card layout. Cards expand naturally based on available width. */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(205px,1fr));
  gap:9px;
  width:100%;
}

.card{
  background:#fff;
  border:1px solid rgba(14,76,145,.08);
  border-radius:11px;
  min-height:124px;
  padding:12px;
  overflow:hidden;
  display:flex;
  gap:12px;
  align-items:flex-start;
  box-shadow:0 1px 0 rgba(10,36,95,.03);
}

.icon{
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e8f3ff;
  font-size:21px;
  flex:0 0 auto;
}

.environment .icon{
  background:#dff3ee;
}

.card > div:last-child{
  flex:1 1 auto;
}

.label{
  font-size:12.5px;
  font-weight:700;
  line-height:1.22;
  margin-bottom:5px;
  overflow-wrap:anywhere;
}

.value{
  font-size:24px;
  font-weight:800;
  line-height:1.05;
  color:#0c1b57;
  overflow-wrap:anywhere;
}

.period{
  font-size:12px;
  color:var(--muted);
  margin-top:6px;
  line-height:1.25;
}

.meaning{
  font-size:11.5px;
  color:#284e7a;
  margin-top:6px;
  line-height:1.3;
  font-weight:600;
}

.card-source{
  font-size:10.5px;
  margin-top:7px;
  line-height:1.25;
}

.card-source a{
  color:#3d6592;
  text-decoration:underline;
  text-underline-offset:2px;
}

.card-source a:hover{
  color:#0d6fe8;
}

/* ---------- STORY VISUALS ---------- */

.visual-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:10px;
  margin-top:10px;
  width:100%;
}

.chart-card,
.story-card{
  background:#fff;
  border:1px solid rgba(14,76,145,.08);
  border-radius:11px;
  padding:14px;
  overflow:hidden;
}

.chart-card h3,
.story-card h3{
  margin:0 0 4px;
  font-size:19px;
}

.chart-sub{
  font-size:13px;
  color:var(--muted);
  margin-bottom:12px;
  line-height:1.35;
}

.chart-source{
  margin-top:10px;
  font-size:11px;
}

.chart-source a{
  color:#3d6592;
  text-decoration:underline;
  text-underline-offset:2px;
}


.visual-stat-card{
  height:100%;
  min-height:100%;
  align-self:stretch;
  padding:20px;
}

.visual-stat-card .value{
  font-size:34px;
  margin-top:4px;
}

.visual-stat-card .meaning{
  margin-top:10px;
  max-width:420px;
}


/* ---------- DONUT ---------- */

.donut-wrap{
  display:grid;
  grid-template-columns:180px 1fr;
  gap:22px;
  align-items:center;
  min-height:220px;
}

.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  position:relative;
  margin:auto;
  box-shadow:inset 0 0 0 1px rgba(11,27,76,.06);
}

.donut::after{
  content:"";
  position:absolute;
  inset:32px;
  background:#fff;
  border-radius:50%;
}

.donut-center{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2;
  text-align:center;
  font-size:12px;
  font-weight:700;
  color:#233d70;
  pointer-events:none;
  padding:52px;
}

.legend{
  display:grid;
  gap:10px;
}

.legend-row{
  display:grid;
  grid-template-columns:14px 1fr auto;
  gap:8px;
  align-items:center;
  font-size:13px;
}

.swatch{
  width:12px;
  height:12px;
  border-radius:3px;
}

.legend-label{
  color:#425a7c;
}

.legend-value{
  font-weight:800;
  color:#0c1b57;
}

/* ---------- SOCIAL SNAPSHOT ---------- */

.note{
  background:rgba(255,255,255,.74);
  border-radius:11px;
  padding:16px;
  font-size:14px;
  line-height:1.45;
  color:#365270;
}

.snapshot-lines{
  display:grid;
  gap:12px;
  margin-top:12px;
}

.snapshot-line{
  padding-bottom:10px;
  border-bottom:1px solid #e8eef5;
}

.snapshot-line:last-child{
  border-bottom:0;
  padding-bottom:0;
}

.snapshot-line strong{
  color:#132c63;
}

/* ---------- ENVIRONMENT HERO COMPARISON ---------- */

.ocean-comparison{
  margin-top:10px;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:10px;
}

.compare-card{
  background:#fff;
  border:1px solid rgba(14,76,145,.08);
  border-radius:11px;
  padding:18px;
  text-align:center;
}

.compare-card .compare-label{
  font-size:12px;
  font-weight:700;
  color:#3f6283;
  text-transform:uppercase;
  letter-spacing:.03em;
}

.compare-card .compare-value{
  font-size:34px;
  line-height:1;
  font-weight:800;
  color:#0c1b57;
  margin:8px 0 5px;
}

.compare-card .compare-note{
  font-size:12px;
  color:var(--muted);
}

.compare-story{
  grid-column:1 / -1;
  background:rgba(255,255,255,.74);
  border-radius:11px;
  padding:14px 16px;
  color:#365270;
  font-size:14px;
  line-height:1.45;
}


/* ---------- LINE CHARTS ---------- */

.line-chart{
  position:relative;
  height:250px;
  margin-top:8px;
  padding:12px 8px 34px 42px;
  border-left:1px solid #dbe5ef;
  border-bottom:1px solid #dbe5ef;
}

.line-chart svg{
  width:100%;
  height:100%;
  overflow:visible;
}

.line-chart .grid{
  stroke:#e8eef5;
  stroke-width:1;
}

.line-chart .zero{
  stroke:#aebed0;
  stroke-width:1.3;
}

.line-chart .path{
  fill:none;
  stroke:#0d6fe8;
  stroke-width:3;
  stroke-linejoin:round;
  stroke-linecap:round;
}

.line-chart .dot{
  fill:#ffffff;
  stroke:#0d6fe8;
  stroke-width:2;
}

.line-axis-label{
  font-size:10px;
  fill:#667892;
}

.line-y-label{
  position:absolute;
  left:0;
  font-size:10px;
  color:#667892;
}

.line-x-labels{
  display:grid;
  gap:0;
  margin:6px 0 0 42px;
  color:#667892;
  font-size:9px;
}

.line-x-labels span{
  text-align:center;
  white-space:nowrap;
  transform:rotate(-35deg);
  transform-origin:top center;
}

@media(max-width:760px){
  .line-chart{
    height:220px;
  }
  .line-x-labels{
    font-size:8px;
  }
}


/* ---------- FOOTER ---------- */

.sources{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:flex-start;
  padding:16px 4px 0;
  font-size:13px;
  color:#4e6380;
  line-height:1.45;
}

.error{
  padding:20px;
  border:1px solid #e0a5a5;
  background:#fff6f6;
  border-radius:10px;
  color:#7b1e1e;
}

/* ---------- EMBED SAFETY ---------- */

html, body, #app, .wrap, .hero, .pillar, .pillar-head,
.cards, .card, .visual-grid, .chart-card, .story-card,
.sources, .ocean-comparison {
  max-width:100% !important;
  min-width:0 !important;
}

img,svg,canvas{
  max-width:100% !important;
}

.sources,.tag,.strap,.label,.period{
  overflow-wrap:anywhere;
}

body{
  overflow-x:hidden !important;
}

/* ---------- RESPONSIVE ---------- */

@media(max-width:1000px){
  .cards{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .visual-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:760px){
  .pillar-head{
    align-items:flex-start;
    flex-wrap:wrap;
  }
  .strap{
    margin-left:64px;
    text-align:left;
    width:100%;
    max-width:none;
  }
  .donut-wrap{
    grid-template-columns:1fr;
  }
  .ocean-comparison{
    grid-template-columns:1fr;
  }
}

@media(max-width:560px){
  .wrap{
    padding:14px 10px;
  }
  .hero h1{
    font-size:34px;
  }
  .cards{
    grid-template-columns:1fr;
  }
  .value{
    font-size:27px;
  }
  .pillar-head h2{
    font-size:23px;
  }
}

const source=(name,url)=>`<div class="chart-source">Source: <a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(name)}</a></div>`;
function cards(rows){return `<div class="cards">${rows.map(x=>`<article class="card" data-indicator="${esc(x.id)}"><div class="icon">${icon(iconFor[x.id])}</div><div><div class="label">${esc(x.label)}</div><div class="value">${esc(x.display)}</div><div class="period">${esc(x.period)}</div>${x.note?`<div class="meaning">${esc(x.note)}</div>`:''}<div class="card-source">Source: <a href="${esc(x.source_url)}" target="_blank" rel="noopener noreferrer">${esc(x.source)}</a></div></div></article>`).join('')}</div>`;}
function pillar(cls,title,tag,strap,content){return `<section class="pillar ${cls}" aria-label="${title}"><div class="pillar-head"><div class="badge">${icon(cls==='social'?'people':cls==='economic'?'chart':'leaf')}</div><h2>${title}</h2><div class="tag">${tag}</div><div class="strap">${strap}</div></div>${content}</section>`;}
function labourChart(){const s=d.unemployment_trend,W=720,H=145;const x=i=>50+i*(W-90)/(s.length-1),y=v=>H-15-(v-3.0)*130;return `<div class="chart-card single-chart"><h3>Unemployment over the past year</h3><div class="chart-sub">Both sexes · percentage of the labour force · quarterly observations</div><svg class="trend" role="img" aria-label="Unemployment changed from 3.3 percent in July 2025 to 3.4 percent in July 2026" viewBox="0 0 ${W} 190">${[3.0,3.5,4.0].map(v=>`<line class="line-grid" x1="40" x2="700" y1="${y(v)}" y2="${y(v)}"/><text class="line-label" x="3" y="${y(v)+4}">${v.toFixed(1)}%</text>`).join('')}<polyline points="${s.map((p,i)=>`${x(i)},${y(p.value)}`).join(' ')}" fill="none" stroke="#0d6fe8" stroke-width="3"/>${s.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.value)}" r="4" fill="#0d6fe8"/><text class="line-label" x="${x(i)}" y="${y(p.value)-12}" text-anchor="middle">${p.value.toFixed(1)}%</text><text class="line-label" x="${x(i)}" y="174" text-anchor="middle">${p.period}</text>`).join('')}</svg>${source(d.social[3].source,d.social[3].source_url)}</div>`;}
function tradeChart(){const t=d.trade;return `<div class="chart-card"><h3>Goods imports and exports</h3><div class="chart-sub">${esc(t.period)} · US$ million</div>${[['Imports',t.imports,'#193b70'],['Exports',t.exports,'#3f9fa6']].map(([label,value,color])=>`<div class="bar-row"><span>${label}</span><div class="bar-track"><div class="bar-fill" style="width:${value/t.imports*100}%;background:${color}"></div></div><strong>${value.toLocaleString('en-US',{minimumFractionDigits:1})}</strong></div>`).join('')}<div class="chart-note">Goods trade deficit: US$${t.deficit.toLocaleString('en-US',{minimumFractionDigits:1})} million. Imports are valued c.i.f.; exports f.o.b.</div>${source(...t.source)}</div>`;}
function inflationChart(){const src=d.economic[0];return `<div class="chart-card"><h3>Annual inflation comparison</h3><div class="chart-sub">12-month change in consumer prices · same month comparison</div>${[['Aug 2025',1.2,'#9db6dc'],['Aug 2026',7.9,'#193b70']].map(([label,value,color])=>`<div class="bar-row"><span>${label}</span><div class="bar-track"><div class="bar-fill" style="width:${value/8*100}%;background:${color}"></div></div><strong>${value.toFixed(1)}%</strong></div>`).join('')}${source(src.source,src.source_url)}</div>`;}
function energyChart(){const e=d.electricity;let c=0;const stops=e.series.map(x=>{const start=c;c+=x.value/e.total*100;return `${x.color} ${start}% ${c}%`;}).join(',');return `<div class="chart-card single-chart"><h3>How grid electricity was generated</h3><div class="chart-sub">${esc(e.period)} · JPS and independent power producers · net generation</div><div class="donut-wrap"><div style="position:relative;width:170px;height:170px;margin:auto"><div class="donut" style="background:conic-gradient(${stops})"></div><div class="donut-center">${(e.total/1e6).toFixed(2)} TWh</div></div><div class="legend">${e.series.map(x=>`<div class="legend-row"><span class="swatch" style="background:${x.color}"></span><span class="legend-label">${esc(x.label)}</span><span class="legend-value">${(x.value/e.total*100).toFixed(1)}%</span></div>`).join('')}</div></div><div class="chart-note">Hydro, wind and solar supplied ${(445852/e.total*100).toFixed(1)}% of net generation. Shares calculated from the reported MWh values.</div>${source(...e.source)}</div>`;}
document.getElementById('app').innerHTML=`<header class="hero"><div><h1>${esc(d.title)}</h1><p>Social, economic and environmental indicators</p></div><div class="updated">Updated ${esc(d.updated)}</div></header>${pillar('social','SOCIAL','People and living conditions','Population, poverty, connectivity and work',cards(d.social)+labourChart())}${pillar('economic','ECONOMIC','Economy and external connections','Prices, output, trade, debt and remittances',cards(d.economic)+`<div class="visual-grid">${tradeChart()}${inflationChart()}</div>`)}${pillar('environment','ENVIRONMENTAL','Energy, forests and climate impacts','Energy dependence and exposure to disasters',cards(d.environment)+energyChart())}<footer class="sources"><div>Each figure carries its own reference period. Preliminary and estimated values are labelled.<br>Source data are available through the linked publications and the Jamaica Open Data statistical CSVs.</div><div style="text-align:right;white-space:nowrap">Updated ${esc(d.updated)}</div></footer>`;
</script></body></html>
